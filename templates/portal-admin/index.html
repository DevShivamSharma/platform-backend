<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/fav.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Organization portal for managing patients, claims, users, and accounts." />

  <!-- Security headers (CSP). connect-src allows Supabase + Stripe.
       frame-ancestors / X-Frame-Options etc. should be set as real HTTP headers at the CDN. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <title>Organization Portal</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/organization/main.tsx"></script>
</body>

</html>
