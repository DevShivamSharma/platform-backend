# Render Blueprint for the platform backend.
# This repo's root IS the server folder, so build/start run directly here.
# Make sure a `templates/` folder exists in this repo (server reads ./templates).
services:
  - type: web
    name: platform-backend
    runtime: node
    plan: free # upgrade to "starter" if cold starts hurt (provisioning is long)
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/schema
    autoDeploy: true
    envVars:
      # Render injects PORT automatically — do NOT set it.
      - key: GITHUB_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_ORG_ID
        sync: false
      - key: SUPABASE_ORG_SLUG
        sync: false
      - key: SUPABASE_REGION
        value: ap-south-1
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel URL, e.g. https://platform-xxxx.vercel.app
